<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Jadwal Akademik</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">AK</div>
        <div>
          <div class="sidebar-brand-text">Akademik</div>
          <span class="sidebar-brand-sub">Schedule Management</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Menu Utama</div>
        <a href="#" class="sidebar-link active" data-page="jadwal">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="16" y1="14" x2="16" y2="14.01"/></svg>
          Jadwal Kuliah
          <span class="badge" id="conflictBadge" style="display:none">0</span>
        </a>

        <div class="sidebar-section-label" style="margin-top: var(--space-3)">Penjadwalan</div>
        <a href="#" class="sidebar-link" data-page="gabungan">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Kelas Gabungan
        </a>

        <div class="sidebar-section-label" style="margin-top: var(--space-3)">Sistem</div>
        <a href="#" class="sidebar-link" data-page="sinkronisasi">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Sinkronisasi
        </a>
        <a href="#" class="sidebar-link" data-page="master">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Master Data
        </a>
        <a href="#" class="sidebar-link" data-page="audit">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Audit Log
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar">SA</div>
          <div>
            <div style="font-weight: var(--weight-medium); color: var(--color-ink)">Staff Akademik</div>
            <div style="font-size: var(--text-xs); color: var(--color-ink-subdued)">admin@kampus.ac.id</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Top Header -->
      <header class="top-header">
        <div class="top-header-left">
          <h1 class="top-header-title" id="pageTitle">Jadwal Kuliah</h1>
        </div>
        <div class="top-header-right">
          <div class="semester-selector">
            <span>Semester:</span>
            <select>
              <option>2025/2026 Ganjil</option>
              <option>2025/2026 Genap</option>
              <option>2024/2025 Ganjil</option>
            </select>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <main class="page-content" id="pageContent">
        <!-- Content rendered by JS -->
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/jadwal.js"></script>
  <script src="js/preferensi.js"></script>
  <script src="js/rolling.js"></script>
  <script src="js/gabungan.js"></script>
  <script src="js/sinkronisasi.js"></script>
  <script src="js/master.js"></script>
  <script src="js/audit.js"></script>
</body>
</html>
